syntax = "proto3";

package novanet.rpc;

option cc_enable_arenas = true;
option optimize_for = SPEED;

// RPC 层通用错误码。
// 注意：这是 RPC 协议层错误，不是业务错误码。
enum RpcErrorCode {
    RPC_OK = 0;

    RPC_UNKNOWN_ERROR = 1;

    // 协议层错误
    RPC_BAD_REQUEST = 2;
    RPC_INVALID_FRAME = 3;
    RPC_UNSUPPORTED_FRAME_TYPE = 4;
    RPC_INTERNAL_ERROR = 5;

    // 路由错误
    RPC_SERVICE_NOT_FOUND = 10;
    RPC_METHOD_NOT_FOUND = 11;

    // Protobuf 编解码错误
    RPC_PARSE_REQUEST_FAILED = 20;
    RPC_PARSE_RESPONSE_FAILED = 21;
    RPC_SERIALIZE_REQUEST_FAILED = 22;
    RPC_SERIALIZE_RESPONSE_FAILED = 23;

    // 调用错误
    RPC_INVOKE_FAILED = 30;
    RPC_TIMEOUT = 31;
    RPC_CANCELLED = 32;
    RPC_CONNECTION_CLOSED = 33;

    // Streaming 相关错误
    RPC_STREAM_NOT_FOUND = 40;
    RPC_STREAM_CLOSED = 41;
    RPC_STREAM_CANCELLED = 42;
    RPC_STREAM_PROTOCOL_ERROR = 43;

    // 背压 / 资源限制
    //
    // 保留 RPC_BACKPRESSURE，避免你现有 RpcStatus.cpp/RpcStatus.h 报错。
    // RPC_BACKPRESSURE_REJECTED 可以后续再加，但现在先别引入新名字。
    RPC_BACKPRESSURE = 50;
    RPC_RESOURCE_EXHAUSTED = 51;

    // Phase 5 预留：服务发现 / 负载均衡 / 重试
    RPC_NO_AVAILABLE_INSTANCE = 100;
    RPC_LOAD_BALANCE_FAILED = 101;
    RPC_RETRY_EXHAUSTED = 102;
}

// Unary 请求元信息。
// 对应 FrameType::UNARY_REQUEST。
message UnaryRequestMeta {
    string service_name = 1;
    string method_name = 2;
    bytes request_payload = 3;

    map<string, string> metadata = 10;
}

// Unary 响应元信息。
// 对应 FrameType::UNARY_RESPONSE。
message UnaryResponseMeta {
    RpcErrorCode error_code = 1;
    string error_text = 2;
    bytes response_payload = 3;

    map<string, string> metadata = 10;
}

// 打开一个逻辑 stream。
// 对应 FrameType::STREAM_OPEN。
message StreamOpenMeta {
    string service_name = 1;
    string method_name = 2;

    // 例如 GenerateRequest 的序列化结果。
    bytes request_payload = 3;

    // 用于未来 backpressure / flow control。
    // 如果为 0，表示使用服务端默认值。
    uint32 initial_window_bytes = 4;

    map<string, string> metadata = 10;
}

// 流数据帧元信息。
// 对应 FrameType::STREAM_DATA。
//
// 最终版推荐：
//   STREAM_DATA payload = StreamDataMeta bytes
//   StreamDataMeta.data = GenerateChunk bytes
message StreamDataMeta {
    uint64 sequence = 1;
    bytes data = 2;

    map<string, string> metadata = 10;
}

// 正常或异常结束一个 stream。
// 对应 FrameType::STREAM_END。
message StreamEndMeta {
    RpcErrorCode error_code = 1;
    string error_text = 2;

    // 可选：总共发送了多少个 chunk。
    uint64 total_sequences = 3;

    map<string, string> metadata = 10;
}

// 取消一个逻辑 stream。
// 对应 FrameType::STREAM_CANCEL。
message StreamCancelMeta {
    string reason = 1;

    map<string, string> metadata = 10;
}

// 协议级错误。
// 对应 FrameType::ERROR_FRAME。
message ErrorFrameMeta {
    RpcErrorCode error_code = 1;
    string error_text = 2;

    // 调试信息。
    string debug_info = 3;

    map<string, string> metadata = 10;
}

// 心跳 payload。
// 对应 FrameType::HEARTBEAT_PING / HEARTBEAT_PONG。
message HeartbeatMeta {
    int64 unix_millis = 1;
    string node_id = 2;

    map<string, string> metadata = 10;
}