syntax = "proto3";

package novanet.ai.chat;

option cc_generic_services = true;

/*
 * ChatMessage 表示一条对话消息。
 *
 * role:
 *   "system" / "user" / "assistant" / "tool"
 *
 * content:
 *   消息文本内容。
 */
message ChatMessage {
    string role = 1;
    string content = 2;
}

/*
 * GenerateRequest 表示一次 LLM Chat 生成请求。
 *
 * 注意：
 * - 不放 stream_id
 * - 不放 request_id
 * - 不放 cancel / heartbeat / timeout
 *
 * 这些属于 NovaNet RPC 协议层，由 RpcHeader / FrameType 表达。
 */
message GenerateRequest {
    // 多轮对话上下文。
    repeated ChatMessage messages = 1;
    // 模型名称，例如 "fake-llm" / "demo-chat-model"。
    string model = 2;

    // 最大生成 token 数。
    uint32 max_tokens = 3;

    // 采样温度。
    float temperature = 4;

    // 停止词。
    repeated string stop = 5;
}

/*
 * GenerateChunk 表示 server streaming 中的一段增量输出。
 *
 * 每个 STREAM_DATA frame 的 payload 可以是一个 GenerateChunk。
 *
 * 注意：
 * - finish_reason 只是业务信息；
 * - 真正结束 stream 必须靠 FrameType::STREAM_END；
 * - 不能用 finish_reason 替代 STREAM_END。
 */
message GenerateChunk {
    // chunk 序号，从 0 开始。
    uint32 index = 1;

    // 本次新增的文本片段。
    string delta = 2;

    // 可选结束原因：
    // "stop" / "length" / "cancelled" / "timeout" / "error"
    //
    // 普通中间 chunk 可以为空。
    string finish_reason = 3;
}

message TokenUsage {
    uint32 prompt_tokens = 1;
    uint32 completion_tokens = 2;
    uint32 total_tokens = 3;
}

/*
 * GenerateResponse 表示非 streaming fallback 或最终聚合结果。
 * 返回流式数据。
 */
message GenerateResponse {
    string full_text = 1;
    TokenUsage usage = 2;
    string finish_reason = 3;
}

service ChatService {
    rpc Generate(GenerateRequest) returns (GenerateResponse);
}