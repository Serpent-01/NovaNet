syntax = "proto3";

package novanet.example.calculator;

option cc_enable_arenas = true;
option optimize_for = SPEED;
option cc_generic_services = true;

message AddRequest {
    sint64 lhs = 1;
    sint64 rhs = 2;
}

message AddResponse {
    sint64 result = 1;
}

service CalculatorService {
    rpc Add(AddRequest) returns (AddResponse);
}